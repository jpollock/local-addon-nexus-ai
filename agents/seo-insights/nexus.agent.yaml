# AUTO-GENERATED by nexus agent tools build — do not edit this section manually
name: seo-insights
version: 1.0.0
description: Describe what this agent does
permissions:
  tier: 1
tools: []
triggers:
  - type: cron
    expression: 0 2 * * *
contributes:
  tools:
    - name: check_index_health
      description: >-
        Check the Nexus content index health for a site. Works for both Local
        and WPE sites.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: Local site name or WPE install name
          staleThresholdHours:
            type: number
            default: 48
        required:
          - siteId
    - name: refresh_wpe_content
      description: Refresh a WP Engine site's content index via SSH.
      executionMode: function
      inputSchema:
        type: object
        properties:
          installName:
            type: string
        required:
          - installName
    - name: pull_to_local
      description: >-
        Create a Local sandbox and pull a WP Engine site into it for full
        wp_eval analysis.
      executionMode: run
      inputSchema:
        type: object
        properties:
          installName:
            type: string
            description: WPE install name
          localSiteName:
            type: string
            description: Name for the new Local sandbox (auto-generated if omitted)
          includeDatabase:
            type: boolean
            default: true
        required:
          - installName
    - name: inventory_content
      description: >-
        Inventory all published content via WordPress PHP. Requires the site to
        be running in Local.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: Local site name (must be running)
          postTypes:
            type: array
            items:
              type: string
            default:
              - post
              - page
          limit:
            type: number
            default: 500
        required:
          - siteId
    - name: find_structural_issues
      description: >-
        Find orphaned posts (no inbound internal links) and stale content.
        Requires the site to be running.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
          staleThresholdDays:
            type: number
            default: 365
        required:
          - siteId
    - name: build_topic_map
      description: >-
        Build a topical map of the site by clustering document embeddings.
        Groups posts by semantic similarity and labels each cluster with its
        dominant topics.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: Local site name or ID
          clusters:
            type: number
            default: 10
            description: Target number of topic clusters
        required:
          - siteId
    - name: find_overlap_candidates
      description: >-
        Find semantically similar page pairs that may compete for the same
        queries. Uses cosine similarity over document embeddings.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
          threshold:
            type: number
            default: 0.85
            description: Cosine similarity threshold (0–1)
        required:
          - siteId
    - name: connect_gsc
      description: >-
        Connect to Google Search Console and select the property to analyze.
        Required before T1 demand analysis tools (detect_cannibalization,
        find_demand_gaps, etc.).
      executionMode: function
      inputSchema:
        type: object
        properties:
          propertyUrl:
            type: string
            description: >-
              Your Search Console property URL (e.g. "https://example.com/" or
              "sc-domain:example.com"). Leave empty to list available
              properties.
    - name: detect_cannibalization
      description: >-
        Find confirmed cannibalization pairs: GSC queries where ≥2 pages on this
        site both receive impressions. Confirms or dismisses T0 semantic overlap
        candidates.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: >-
              Local site name or ID (for cross-referencing with T0 overlap
              candidates)
          minImpressions:
            type: number
            default: 10
            description: Minimum impressions to flag a query
        required:
          - siteId
    - name: find_demand_gaps
      description: >-
        Find demand gaps: GSC queries with impressions but no well-ranking page
        on this site. Includes a striking-distance view (positions 8-20) as the
        fastest-win queue.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: Local site name or ID — used to search existing content
          minImpressions:
            type: number
            default: 50
          strikeZoneMin:
            type: number
            default: 8
          strikeZoneMax:
            type: number
            default: 20
        required:
          - siteId
    - name: classify_intent
      description: >-
        Classify Search Console queries by intent: informational, navigational,
        transactional, commercial. Cached — subsequent calls use stored results.
      executionMode: function
      inputSchema:
        type: object
        properties:
          minImpressions:
            type: number
            default: 20
            description: Only classify queries with this many impressions
          refresh:
            type: boolean
            default: false
            description: Re-classify even if cached results exist
    - name: detect_decay
      description: >-
        Detect pages with declining clicks or impressions over the past 28 days
        vs. the prior 28-day period.
      executionMode: function
      inputSchema:
        type: object
        properties:
          minImpressionsPrior:
            type: number
            default: 50
            description: Minimum impressions in prior period to be considered
          declineThresholdPct:
            type: number
            default: 20
            description: Flag pages that lost ≥this % of clicks or impressions
    - name: analyze_ai_crawl_health
      description: >-
        Analyze AI crawler traffic (training and retrieval bots) from access log
        aggregates. Requires log-processor to have ingested logs for this site.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: Site ID to analyze
          days:
            type: number
            default: 30
            description: Number of days to analyze (default 30)
        required:
          - siteId
    - name: analyze_404_demand
      description: >-
        Analyze 404 errors that look like real content requests (demand
        signals). Uses access log aggregates from log-processor. High-volume
        content-like 404s indicate topics the audience wants.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: Site ID to analyze
          days:
            type: number
            default: 30
            description: Number of days to analyze (default 30)
          minHits:
            type: number
            default: 5
            description: Minimum hits to surface a 404 path
        required:
          - siteId
    - name: analyze_referral_sources
      description: >-
        Analyze traffic referral sources from access log aggregates: search
        engines, AI referrers, direct, and other. Uses log-processor data.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: Site ID to analyze
          days:
            type: number
            default: 30
            description: Number of days to analyze (default 30)
        required:
          - siteId
