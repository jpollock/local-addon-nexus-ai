# AUTO-GENERATED by nexus agent tools build — do not edit this section manually
#
# Regenerated to match agent.ts v0.5.0. Add manifest regeneration + a drift check
# to CI: a stale manifest means the deployed triggers, permissions, and granted
# credentials diverge from the code that actually runs.
name: seo-insights
version: 0.5.0
description: >-
  Content strategy agent — topical map, structural issues, traffic
  intelligence, and Search Console demand analysis for a WordPress site.
permissions:
  # Tier 2: creates and starts Local sandbox sites and pulls WP Engine content
  # into them. Not destructive to any source environment (no deletes, no
  # pushes), but tier 1 understated the sandbox-creation capability.
  # Confirm tier semantics with the platform team.
  tier: 2
tools:
  - local_list_sites
  - search_site_content
  - get_all_site_documents
  - wp_eval
  - get_index_status
  - reindex_site
  - fleet_sql
  - wpe_site_deep_refresh
  - local_create_site
  - local_wpe_pull
  - local_start_site
  - local_clone_site
  - local_operation_status
  - get_log_aggregates
  - fetch_log_window
  - local_wpe_link
credentials:
  # Declared in agent.ts but previously absent from the manifest — if the
  # runtime enforces manifest declarations, GSC access was never granted.
  - provider: google
    scopes:
      - https://www.googleapis.com/auth/webmasters.readonly
    optional: true
    reason: >-
      Reads Search Console query data to find demand gaps and confirm
      cannibalization
triggers:
  - type: cron
    expression: 0 7 * * 1
  - type: event
    name: wpe:sync.completed
contributes:
  tools:
    - name: check_index_health
      description: >-
        Check the Nexus content index health for a site. Works for both Local
        and WPE sites.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: Local site name or WPE install name
          staleThresholdHours:
            type: number
            default: 48
        required:
          - siteId
    - name: refresh_wpe_content
      description: Refresh a WP Engine site's content index via SSH.
      executionMode: function
      inputSchema:
        type: object
        properties:
          installName:
            type: string
        required:
          - installName
    - name: pull_to_local
      description: >-
        Create (or reuse) a Local sandbox and pull a WP Engine site into it for
        full wp_eval analysis. The sandbox name is stable per install
        (seo-<install>) so repeat runs reuse it instead of accumulating copies.
      executionMode: run
      inputSchema:
        type: object
        properties:
          installName:
            type: string
            description: WPE install name
          localSiteName:
            type: string
            description: >-
              Sandbox name override (default: seo-<install>, reused across runs)
          includeDatabase:
            type: boolean
            default: true
        required:
          - installName
    - name: inventory_content
      description: >-
        Inventory all published content via WordPress PHP. Requires the site to
        be running in Local.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: Local site name (must be running)
          postTypes:
            type: array
            items:
              type: string
            default:
              - post
              - page
          limit:
            type: number
            default: 500
        required:
          - siteId
    - name: find_structural_issues
      description: >-
        Find orphaned posts (no inbound internal links) and stale content.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
          staleThresholdDays:
            type: number
            default: 365
        required:
          - siteId
    - name: build_topic_map
      description: >-
        Build a topical map of the site by clustering document embeddings.
        Chunks are mean-pooled per post, and each cluster is labeled with its
        distinguishing TF-IDF terms.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: Local site name or ID
          clusters:
            type: number
            default: 10
            description: Target number of topic clusters
        required:
          - siteId
    - name: find_overlap_candidates
      description: >-
        Find semantically similar page pairs that may compete for the same
        queries. Chunk vectors are mean-pooled per post; degraded (truncated)
        index entries are excluded.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
          threshold:
            type: number
            default: 0.85
            description: Cosine similarity threshold (0–1)
        required:
          - siteId
    - name: connect_gsc
      description: >-
        Connect to Google Search Console and bind a property to a site.
        Bindings are per-site. Required before the demand analysis tools
        (detect_cannibalization, find_demand_gaps, classify_intent,
        detect_decay).
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: >-
              Site this property belongs to (Local site name or WPE install
              name). Property bindings are per-site.
          propertyUrl:
            type: string
            description: >-
              Search Console property URL (e.g. "https://example.com/" or
              "sc-domain:example.com"). Leave empty to list available
              properties.
        required:
          - siteId
    - name: detect_cannibalization
      description: >-
        Find confirmed cannibalization pairs: Search Console queries where two
        or more pages on this site both receive impressions. Confirms or
        dismisses the semantic overlap candidates.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: Site whose bound GSC property to analyze (see connect_gsc)
          minImpressions:
            type: number
            default: 10
            description: Minimum impressions to flag a query
        required:
          - siteId
    - name: find_demand_gaps
      description: >-
        Find weak content coverage: Search Console queries with impressions
        where no strongly matching page exists (ranking beyond page 1), plus a
        striking-distance queue (positions 8-20) of existing pages worth
        improving.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: >-
              Site whose bound GSC property to analyze — also used to search
              existing content
          minImpressions:
            type: number
            default: 50
          strikeZoneMin:
            type: number
            default: 8
          strikeZoneMax:
            type: number
            default: 20
        required:
          - siteId
    - name: classify_intent
      description: >-
        Classify Search Console queries by intent: informational,
        navigational, transactional, commercial. Cached per property —
        subsequent calls reuse stored results.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: Site whose bound GSC property to analyze (see connect_gsc)
          minImpressions:
            type: number
            default: 20
            description: Only classify queries with this many impressions
          refresh:
            type: boolean
            default: false
            description: Re-classify even if cached results exist
        required:
          - siteId
    - name: detect_decay
      description: >-
        Detect pages with declining clicks or impressions over the past 28
        complete days vs. the prior 28-day period. Windows end 2 days back
        because Search Console data is incomplete for recent days.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: Site whose bound GSC property to analyze (see connect_gsc)
          minImpressionsPrior:
            type: number
            default: 50
            description: Minimum impressions in prior period to be considered
          declineThresholdPct:
            type: number
            default: 20
            description: Flag pages that lost ≥this % of clicks or impressions
        required:
          - siteId
    - name: analyze_ai_crawl_health
      description: >-
        AI crawler activity from access log aggregates: which AI systems crawl
        this site (training vs. retrieval), what they fetch, and where rate
        limits or WAF rules block them. Requires log-processor.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: WPE install name (log-processor site key)
          days:
            type: number
            default: 30
        required:
          - siteId
    - name: analyze_404_demand
      description: >-
        Content-like 404s from access logs — URLs real visitors request that
        do not exist, with scanner and probe noise filtered out. Requires
        log-processor.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: WPE install name (log-processor site key)
          days:
            type: number
            default: 30
        required:
          - siteId
    - name: analyze_referral_sources
      description: >-
        Referral attribution from access logs: search vs. AI assistant
        referrals for human-plausible traffic, with spoofed referrers surfaced
        separately. Requires log-processor.
      executionMode: function
      inputSchema:
        type: object
        properties:
          siteId:
            type: string
            description: WPE install name (log-processor site key)
          days:
            type: number
            default: 30
        required:
          - siteId
