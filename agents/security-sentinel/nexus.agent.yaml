name: security-sentinel
version: 1.0.0
description: Fleet-wide security surveillance — detects compromise and pre-breach exposure across all WPE installs
author:
  name: WP Engine
  verified: true

# Documentation only — the runtime reads triggers from agent.js's `module.exports.triggers`, and
# loadManifest() takes just `contributes.tools` from this file. Kept in agreement with it because
# this is the file someone opens to change a schedule, and it was left claiming
# `wpe:sync.completed` for nineteen days after that trigger was removed as the cause of an
# incident. The rationale for each entry is in agent.js beside the array that actually runs.
triggers:
  - type: cron
    expression: "0 3 * * *"
  - type: event
    pattern: wp:plugin.activated
  - type: event
    pattern: wp:user.created

tools:
  - fleet_sql
  - wpe_site_deep_refresh
  - wp_user_list
  - wp_plugin_list
  - compare_sites
  - local_create_site
  - local_clone_site
  - local_start_site
  - local_restart_site
  - local_wpe_pull
  - local_operation_status
  - wp_eval
  - scan_site_files
  - local_wpe_push

contributes:
  tools:
    - name: scan
      description: "Run the Security Sentinel on a specific site — detects malware, backdoor plugins, obfuscated code, tampered core files, spam injection, ELF binaries, and C2 indicators. Use this (not scan_database_health) when security investigation is needed."
      executionMode: function
      inputSchema:
        type: object
        properties:
          site:
            type: string
            description: Site name or install ID to scan
        required: [site]
    - name: get-report
      description: Return the latest Sentinel forensic report for a site as markdown
      executionMode: function
      permissionTier: 1
      inputSchema:
        type: object
        properties:
          site:
            type: string
            description: Site name (e.g. "theawfulpm-test")
        required: [site]
    - name: list-reports
      description: List all available Sentinel reports grouped by site, newest first
      executionMode: function
      permissionTier: 1
      inputSchema:
        type: object
        properties: {}
        required: []

permissions:
  tier: 3
  scope: fleet

runtime:
  - local

ui:
  autonomy_description: "Investigates on its own • you approve anything on production"
  kpis:
    - label: Sites monitored
      query: "SELECT COUNT(*) FROM sites WHERE source='wpe'"
      color: default
    - label: Active threats
      query: "SELECT COUNT(DISTINCT site_id) FROM agent_security_sentinel_findings WHERE severity IN ('critical','high') AND resolved=0"
      color: red
