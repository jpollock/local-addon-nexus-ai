# Platform Benchmark — Nexus vs Coworker vs WordPress
# Spec: docs/planning/2026-08-25-platform-benchmark-v2.md   (v2 — grading/harness)
#       docs/planning/2026-08-21-platform-benchmark-design.md (v1 — substrate/scenarios)
#
# Two MCP surfaces, one model, identical prompts.
# WordPress column deferred — core abilities (site-info, user-info, env-info)
# do not reach content. Will revisit with custom ability implementation.
# Repeat: 3 (raise to 5 before publishing any numbers).
#
# Run via ./run.sh, NOT promptfoo directly — run.sh clears the per-cwd Claude
# memory each column would otherwise carry between runs. See providers/isolation.js
# for both isolation leaks found in eval-t7J-2026-08-24T22:22:15 and how they close.
#
# Every answer key below is verified against the sites themselves (wp eval over
# SSH, 2026-08-24), never against a column's own answer. A key copied from the
# output you are grading is not a key.
#
# Run:
#   ./run.sh
#   npx promptfoo view

description: "Platform benchmark — Nexus vs Coworker (Cedar & Vale substrate)"

evaluateOptions:
  maxConcurrency: 1   # providers call external services; sequential avoids rate limits
  repeat: 3           # 3 per cell; raise to 5 before publishing

providers:
  - id: file:///Users/jeremy.pollock/development/wpengine/local-addon-nexus-ai/tests/platform-bench/providers/nexus.js
    label: Nexus

  - id: file:///Users/jeremy.pollock/development/wpengine/local-addon-nexus-ai/tests/platform-bench/providers/coworker.js
    label: Coworker

# ── Substrate constants ────────────────────────────────────────────────────────
# Sites in scope. Update if the fleet changes.
# Coworker collection IDs are stable per-site and hard-coded in coworker.js.
#
#   Flagship  cedarvalehealt.wpenginepowered.com    col_elNAyZoSKGhJoFCFqHSK12
#   Site A    summitdermatol.wpenginepowered.com    col_KO2gvD3Tbw5Rvuv0msq4dQ
#   Site B    palegreen-capybara-114180.hostingersite.com  col_tErE8KxfsfxWrtd1HscbCe
#   Commerce  alpineoutfitte.wpenginepowered.com    col_dhR33vS98LEeZ0CVUVTnZK

defaultTest:
  options:
    # All llm-rubric assertions grade through this provider — claude -p on the
    # pinned haiku model, blind (the rubric prompt never carries the column
    # label), isolated like a column. See providers/grader.js.
    provider: file:///Users/jeremy.pollock/development/wpengine/local-addon-nexus-ai/tests/platform-bench/providers/grader.js
  assert:
    - type: latency
      threshold: 600000   # 10 min max per cell

# ── Test cases ────────────────────────────────────────────────────────────────
tests:
  # ── CV-A-01: missing openingHoursSpecification ────────────────────────────
  - description: "CV-A-01 — which clinic sites are missing opening hours?"
    vars:
      prompt: >
        Look at the clinic locations across cedarvalehealt and summitdermatol.
        Which site's locations are missing opening hours data, and which has it?
        Be specific about which site has the gap.
    assert:
      # Anchor: the site with the gap must be named. Necessary, not sufficient —
      # the rubric below does the discrimination.
      - type: icontains
        value: "summitdermatol"
      # Answer key (keys.json: summit.locations, cedarvale.locations; verified by
      # wp eval over SSH 2026-08-24). Rubric grading replaced two generations of
      # literal-substring and clause-parser assertions here — three false
      # negatives across eval-VWU and eval-NHz, all "a literal standing in for a
      # semantic claim". The grader receives the key as supplied fact and judges
      # meaning; markdown bold, clause order, and synonyms can no longer fail a
      # correct answer. History: docs/planning/2026-08-25-platform-benchmark-v2.md §1.
      - type: llm-rubric
        value: >
          Ground truth, verified against the sites themselves: the site
          summitdermatol has 2 clinic locations and NONE of them have any
          opening-hours data (the hours field is entirely absent). The site
          cedarvalehealt has 25 clinic locations and ALL 25 have opening hours.

          PASS only if the response asserts BOTH of the following, in any
          wording or formatting: (1) summitdermatol is the site whose locations
          are missing opening hours, AND (2) cedarvalehealt's locations have
          opening hours.

          FAIL if the response claims neither site has hours, claims both
          sites are missing hours, inverts the two sites, only names a site
          without identifying the missing-hours gap, or declines to answer.
  # ── CV-B-01: cross-site provider contradiction ────────────────────────────
  - description: "CV-B-01 — which providers accept new patients at two different practices?"
    vars:
      prompt: >
        Check the providers on cedarvalehealt and palegreen-capybara-114180.hostingersite.com.
        Are any providers listed as accepting new patients at both sites simultaneously?
        How many, and name them.
    assert:
      # Answer key, verified by wp eval on both sites 2026-08-24:
      #   cedarvalehealt  60 providers, 45 accepting
      #   palegreen       27 providers, 23 accepting
      #   overlap on NPI  23 — every accepting Ridgeline provider is also
      #                   accepting at Cedar & Vale; ZERO are Ridgeline-only.
      # The old key named Elian Mills / NPI 1274960149 as *the* contradiction.
      # Elian Mills is real and is in the overlap, but the substrate holds 23 such
      # providers, not one — so no correct answer could satisfy a single-NPI key,
      # and the answer it did reward (exactly one) is wrong.
      #
      # The count is the discriminator. An answer naming one provider cannot
      # contain a standalone 23, so this also excludes the old key's answer.
      # Anchor: the overlap count is a deterministic atom. Kept per spec §3.1;
      # a bare "23" appearing incidentally in a WRONG answer is possible but
      # the rubric below independently requires the claim, not just the token.
      - type: regex
        value: '\b23\b'
      # Deterministic hallucination guard: this scenario names two sites; a
      # third can only be fabricated (willowcreekderm is reachable by neither
      # route in this prompt's scope).
      - type: not-icontains
        value: "willowcreekderm"
      - type: llm-rubric
        value: >
          Ground truth, verified against both sites: cedarvalehealt lists 60
          providers of which 45 accept new patients;
          palegreen-capybara-114180.hostingersite.com (Ridgeline) lists 27
          providers of which 23 accept new patients. Exactly 23 providers,
          matched on NPI number, are accepting new patients at BOTH sites —
          every accepting Ridgeline provider also accepts at the other site.
          Known members of that overlap include: Elian Mills PA-C
          (NPI 1274960149), Elias Lowe DO, Cielo Wehner MD, Susan Hand,
          Clementine Lang, Emilie Gutkowski.

          PASS only if the response states that providers ARE accepting at both
          sites simultaneously, gives the overlap count as 23, and names at
          least one provider. Do not fail an answer solely because it names
          overlap members outside the sample list above — the list is a sample
          of 23, not the full set.

          FAIL if the response denies any overlap exists, presents exactly one
          provider as the only overlap, gives a count other than 23, or names
          no providers at all.
  # ── CV-G-01: stale medical reviews ───────────────────────────────────────
  - description: "CV-G-01 — how many treatments on cedarvalehealt have not been reviewed in 3+ years?"
    vars:
      prompt: >
        On cedarvalehealt, how many treatment pages have not been clinically reviewed
        in the past three years? What is the count, and what is the review status?
    assert:
      # Answer key, verified by wp eval on cedarvalehealt 2026-08-24 over the
      # `treatment` post type (meta keys `review_status` and `review_date`):
      #   45 treatments total
      #    8 review_status=overdue, review_date 2021-10-18 … 2023-05-12 (all >3y)
      #    2 review_status=unreviewed, review_date empty
      #   35 reviewed within the window
      #   → 10 of 45 have not been reviewed in three years.
      # The old key said 8, which drops the 2 unreviewed pages — and asserted it
      # as icontains-any ["8","eight"], which any output containing a date passes
      # ("2026-08-24"). Both columns already answer 10 of 45 correctly; the
      # assertion was measuring nothing either way.
      # Anchor: the status word every correct answer uses. The old numeric
      # anchors are gone: '\b8\b' matched "8:00" and dates ("2021-10-18"
      # contains \b10\b), so neither 8 nor 10 is anchorable — the counts are
      # the rubric's job.
      - type: icontains
        value: "overdue"
      - type: llm-rubric
        value: >
          Ground truth, verified against the site: there are 45 treatment pages
          in total. 10 of them have not been clinically reviewed in the past
          three years — 8 with review status "overdue" (review dates in
          2021–2023, all older than three years) and 2 with status
          "unreviewed" and no review date at all. The other 35 were reviewed
          within the window.

          PASS only if the response gives 10 as the count of treatment pages
          not reviewed in three years AND distinguishes the overdue set (8)
          from the never-reviewed set (2).

          FAIL if the response gives 8 (or any number other than 10) as the
          total stale count, omits the 2 never-reviewed pages, gives no count,
          or declines to answer.
  # ── Reach test: ask about a site only Nexus can see ──────────────────────
  # Ground truth verified 2026-08-24:
  #   `nexus wp core version ssh:willowcreekderm/willowcreekderm@production` → 6.9.7
  #   willowcreekderm is a registered external SSH host in Nexus; it has no
  #   Coworker KB collection and no WordPress MCP connection.
  #
  # The two columns are graded on OPPOSITE expectations, so one assertion cannot
  # express both. The old single `icontains-any` accepted the union of every
  # outcome — "6.9.7", a bare "6.9", *or* any refusal — which every column passes
  # no matter what it does. It measured nothing.
  #
  # Per-provider via context.provider.label (verified available in this promptfoo
  # version). Nexus must return the live version. Every other column must decline,
  # and must NOT state a version — with `--tools ""` it has no route to this site,
  # so a version is fabricated whether or not it happens to be right.
  - description: "Reach — willowcreekderm (external SSH only; Nexus must answer, others must decline)"
    vars:
      prompt: >
        What WordPress version is willowcreekderm.com running?
    assert:
      - type: javascript
        value: |
          const label = String((context.provider && context.provider.label) || '');
          const out = String(output);
          if (label === 'Nexus') {
            return out.includes('6.9.7')
              ? { pass: true, score: 1, reason: 'Nexus reported the live version 6.9.7' }
              : { pass: false, score: 0,
                  reason: 'willowcreekderm is a registered external SSH host in Nexus; expected 6.9.7. Got: '
                          + out.slice(0, 300) };
          }
          // No route to this site: any version number is fabricated.
          const versionClaim = /\b\d+\.\d+(\.\d+)?\b/.test(out);
          if (versionClaim) {
            return { pass: false, score: 0,
                     reason: label + ' has no route to willowcreekderm but stated a version: '
                             + (out.match(/\b\d+\.\d+(\.\d+)?\b/) || [''])[0] };
          }
          const declined = /(cannot|can'?t|unable|no access|don'?t have|do not have|not (in|available|connected|configured|part of|one of)|isn'?t (in|available)|no (knowledge|collection|data|record|kb)|not found)/i.test(out);
          return declined
            ? { pass: true, score: 1, reason: label + ' correctly declined — no route to this site' }
            : { pass: false, score: 0,
                reason: label + ' neither declined nor gave a version: ' + out.slice(0, 300) };

  # ══ In-site intelligence: Alpine Outfitters ═══════════════════════════════
  # A different task class from CV-A/B/G. Those are lookups: one verifiable
  # fact, retrievable in a few calls. These are AUDITS — the answer requires
  # decomposing a vague business question into censuses nobody asked for, and
  # then reasoning about ABSENCE (no audience taxonomy, no kids SKU, no trip a
  # party of three can book). No retrieval hit can surface a thing that is not
  # there; that is the capability under test.
  #
  # Both columns can reach this site: it is WPE install alpineoutfitte AND
  # Coworker collection col_dhR33vS98LEeZ0CVUVTnZK (349 docs, post-type facets
  # and metadata aggregations available). Counting is not rigged either way.
  #
  # The prompts name `alpineoutfitte` explicitly. Four Alpine installs exist
  # (production / staging / development / a Local site), the exact name-collision
  # hazard CLAUDE.md documents for `goldenecomm`. Left ambiguous, a column may
  # route to the halted Local site and START it mid-run, and we would be
  # grading harness side effects instead of intelligence.
  #
  # NO deterministic content anchors on this family, deliberately. CV-G already
  # retired its numeric anchors (`\b8\b` matched "8:00"; dates contain \b10\b),
  # and the whole-branch review flagged CV-B-01's `not-icontains` guard as able
  # to false-negative an honest scoping mention. An audit's wording varies far
  # more than a lookup's, and every site name worth guarding against already
  # appears in the Coworker column's own prepended collection map — so a guard
  # would fire on a model that merely says which collection it chose. The
  # rubrics carry explicit fabrication FAIL clauses instead.
  #
  # Every figure below is gated by keys.json → sites.alpineoutfitte, so the
  # drift gate catches substrate edits the same way it does for the clinics.
  # Cost note: audit cells run long (~2-3 min each). 3 scenarios x 2 columns
  # x repeat 3 = 18 cells. Use --filter-pattern 'AO-' to run this family alone.

  # ── AO-A-01: family-hiking coverage audit ─────────────────────────────────
  - description: "AO-A-01 — what family-hiking coverage exists on alpineoutfitte, and what is missing?"
    vars:
      prompt: >
        We're thinking about expanding our content for families who like to hike.
        Look at the site alpineoutfitte and tell me what family-focused coverage
        we have today and what's missing.
    assert:
      - type: llm-rubric
        value: >
          Ground truth, measured against the site: alpineoutfitte has 60 blog
          posts, of which exactly ONE is family-focused; zero posts carry a
          family or kids tag; all 60 posts sit in Uncategorized; and the tag
          vocabulary of 22 terms contains no family, kids, child or audience
          term. It has 40 destinations, of which 8 are difficulty 1 and 13 are
          difficulty 2 or easier — and all 8 of the difficulty-1 destinations
          DO carry a boilerplate family-suitability sentence in their body
          copy, while having no structured family data: the destination
          taxonomies are difficulty, region, season and trail_type, with no
          audience dimension. It sells 181 products across 9 categories, none
          of them kids or youth. It offers 30 guided trips, the smallest
          minimum group size being 4.

          PASS only if the response asserts ALL FOUR of the following, in any
          wording, order or formatting:
          (1) dedicated family blog coverage is essentially a single post,
              stated against the blog corpus (60 posts);
          (2) easy or beginner destination inventory DOES exist, with a count —
              either 8 at difficulty 1 or 13 at difficulty 2 or easier is
              acceptable;
          (3) there are no kids or youth products, grounded in the catalog by
              giving the product total (181) or the category count (9);
          (4) at least one structural findability gap — no family/kids tag or
              audience taxonomy, or all posts being uncategorized, or the
              absence of a family/age field on destinations.

          FAIL if the response claims substantial existing family coverage,
          claims the site has NO easy or beginner trail inventory, invents
          family products, family trips or family blog posts that do not
          exist, gives no counts anywhere, or declines to answer.

          Do NOT grade the recommendations the response offers — what to build
          next is judgment, and two good answers order it differently. Do NOT
          fail a response for noting that the easy destinations already carry
          a family-suitability mention; that is true and is a sign the
          inventory was actually read.

  # ── AO-B-01: bookability threshold ────────────────────────────────────────
  - description: "AO-B-01 — can a family of three book any guided trip on alpineoutfitte?"
    vars:
      prompt: >
        A family of three — two adults and one child — wants to book a guided
        trip on alpineoutfitte. Which trips can they book?
    assert:
      - type: llm-rubric
        value: >
          Ground truth, measured against the site: alpineoutfitte lists 30
          guided trips. Every one of them requires a minimum group size of 4
          or more; the smallest minimum on the site is 4. NO trip on the site
          can be booked by a party of three.

          PASS only if the response states that no trip is bookable by a party
          of three, AND grounds that claim in the trip data — either by citing
          the minimum group size (4) or by stating that all 30 trips require
          at least 4 people. Either grounding is acceptable.

          FAIL if the response names any trip as bookable by this family, says
          some trips are available to them, claims the trip data does not
          exist or cannot be reached, or declines to answer. Also FAIL an
          unsupported "no" — a response that reports no bookable trips without
          any reference to group size or the trip inventory has not
          demonstrated it looked, and a correct answer reached by not looking
          is not a correct answer.

  # ── AO-C-01: catalog gap, with denominator ────────────────────────────────
  - description: "AO-C-01 — does alpineoutfitte sell kids gear, and how does the catalog break down?"
    vars:
      prompt: >
        We're considering launching a kids' gear line on alpineoutfitte. What
        kids or youth products do we sell today, and how does the current
        catalog break down?
    assert:
      - type: llm-rubric
        value: >
          Ground truth, measured against the site: alpineoutfitte sells 181
          products across 9 categories. NONE of them is a kids or youth
          product — no product title and no product category contains a kids,
          youth, junior, child or toddler term. The only kid-related string
          anywhere in the product copy is the verb "baby" in one pack
          description ("you do not have to baby your gear"), which is not a
          kids product.

          PASS only if the response states that there are no kids or youth
          products today, AND grounds that in the catalog — either by giving
          the product total (181) or by counting or enumerating the existing
          categories (9). Either grounding is acceptable.

          FAIL if the response claims kids or youth products exist, presents
          the "baby your gear" copy as evidence of a kids product, or declines
          to answer. Also FAIL a bare "none" offered with no product count and
          no category breakdown — a correct negative that never enumerated the
          catalog is correct by blindness, not by measurement.

  # ══ Site intelligence ═════════════════════════════════════════════════════
  # Taxonomy and full drafting rationale: docs/planning/2026-08-25-scenario-taxonomy.md
  #
  # These fill the quadrant the suite had no coverage of at all. Two grading shapes
  # appear below and the difference is load-bearing:
  #
  #   AO-S-01 uses a SHARED rubric, because Coworker genuinely reaches plugin data —
  #   with a personal API key and a per-site WordPress account connection,
  #   `run_site_ability` runs `power-coworker/list-plugins`. Verified live 2026-08-25.
  #   An earlier draft graded it REACH-style on the assumption Coworker had no route;
  #   that was wrong, and grading it that way would have published a decline we caused.
  #   Requires COWORKER_ABILITIES=1 and a personal key (providers/coworker.js).
  #
  #   WC-S-01, FL-ACF-01 and AO-T-01 use REACH-01's per-provider shape, because each
  #   asks for something no ability can reach: a site with no Power site connection,
  #   a fleet-wide question (abilities are per-site by construction), and access logs.
  #   Those are structural limits, not credential gaps — they will not flip.
  #
  # Run this family alone with --filter-pattern 'AO-S|WC-S|FL-|AO-T'.
  #
  # KNOWN RESIDUAL, and the deterministic fix if it bites again. promptfoo runs
  # EVERY assertion against EVERY provider, so on the three capability scenarios
  # the llm-rubric is handed the declining column's refusal as well as Nexus's
  # answer. The gate at the top of each rubric tells the grader to pass a refusal
  # untouched — but that is an LLM obeying an instruction, not a guarantee. It held
  # 2 of 3 times in eval-xTZ; the miss read "there is no site called X in this
  # account" as a false claim about the world rather than a statement about access,
  # which is why the gate now spells that distinction out.
  #
  # If it misses again, stop strengthening the wording and split the run instead:
  #   ./run.sh --filter-pattern 'WC-S|FL-|AO-T' --filter-providers 'Nexus'
  # grades only Nexus against the rubrics, and a second pass over the other
  # column can assert on the javascript check alone from a config whose capability
  # scenarios carry no rubric. Two archived runs instead of one, and the trend
  # report already handles that — a deterministic split beats a persuasive prompt.

  # ── AO-S-01: software inventory, and what each route cannot see ───────────
  - description: "AO-S-01 — software inventory on alpineoutfitte for a new maintainer"
    vars:
      prompt: >
        We are taking over maintenance of alpineoutfitte. Give me the software
        inventory — what is installed, what is actually running, and what versions.
        Flag anything a new maintainer should know about.
    assert:
      # No deterministic anchors, per the AO family's rule: an audit's wording varies
      # far more than a lookup's, and every count here appears in three different
      # correct forms depending on which route the column took.
      - type: llm-rubric
        value: >
          Ground truth, measured live over SSH (`wp plugin list`) on 2026-08-25:
          alpineoutfitte has 21 plugin entries — 10 ACTIVE, 1 INACTIVE
          (ai-provider-for-local-gateway), 8 MUST-USE, and 2 DROP-INS
          (advanced-cache.php, object-cache.php). WordPress 7.1, PHP 8.4.
          ACF PRO 6.8.8; WooCommerce 11.0.1 active with 181 products.

          Three routes see three different things and none is complete alone. A
          WP-CLI route sees all 21 and classifies them. A WordPress plugins REST
          API route (which is what the Coworker column's list-plugins ability uses)
          sees ONLY the 11 regular plugins — must-use and drop-ins are invisible to
          it. A cached route that stores one active/inactive flag reports "11
          inactive", which is wrong twice over: only one plugin is genuinely
          inactive, and eight of those eleven cannot be deactivated at all.

          This scenario grades SCOPE HONESTY, not raw completeness.

          PASS only if the response satisfies ALL THREE:
          (1) 10 active and 1 inactive — the one figure both routes agree on;
          (2) scope is either complete or declared — EITHER the 8 must-use and 2
              drop-ins are accounted for (a total of 21, or those classes named),
              OR the response states that its count covers regular plugins only.
              A regular-plugins-only count presented as the whole inventory, with
              no scope statement, FAILS this clause;
          (3) platform grounding — WordPress 7.1 and PHP 8.4, or the ACF PRO 6.8.8
              / WooCommerce 11.0.1 versions.

          FAIL if the response gives any inactive count above 1 (11 and 12 are the
          specific wrong answers a cached route produces), presents a
          regular-plugins-only count as the complete inventory without saying so,
          names plugins that are not installed, gives no counts, or declines.

          Do NOT grade which findings the response chooses to flag — a new
          maintainer's priorities are judgment. Do NOT fail a response for noting
          that most of this stack is platform or benchmark instrumentation rather
          than a typical client site; that is true. Do NOT require update
          availability here.

  # ── WC-S-01: currency is not maintenance ─────────────────────────────────
  - description: "WC-S-01 — plugin maintenance risk on willowcreekderm"
    vars:
      prompt: >
        Audit the plugins on willowcreekderm. Is anything on this site a
        maintenance risk?
    assert:
      - type: javascript
        value: |
          const label = String((context.provider && context.provider.label) || '');
          const out = String(output);
          if (label !== 'Nexus') {
            // willowcreekderm has no Power site connection — it is absent from
            // list_account_sites entirely, and at WordPress 6.9.7 it sits below the
            // hub's 7.0 floor, so it cannot get one. The decline is structural and
            // permanent, not a withheld tool. Any plugin claim is fabricated.
            const fabricated = /search-everything|limit-login|spinupwp|advanced-custom-fields/i.test(out);
            if (fabricated) {
              return { pass: false, score: 0,
                       reason: label + ' has no route to willowcreekderm but named its plugins: ' + out.slice(0, 300) };
            }
            // Widened after eval-orG: "There is no `willowcreekderm` site in this account"
            // is an honest decline and matched none of the original alternatives, so a
            // correct refusal scored as a failure. Phrasing varies far more than the
            // fact being expressed — when in doubt, add the phrasing.
            const declined = /(cannot|can'?t|unable|no access|don'?t have|do not have|not (in|available|connected|configured|part of|one of)|isn'?t (in|available)|there (is|are) no|no (site|such site|match|matching)|does not exist|doesn'?t exist|no (knowledge|collection|data|record|kb)|not found)/i.test(out);
            return declined
              ? { pass: true, score: 1, reason: label + ' correctly declined — no site connection to this host' }
              : { pass: false, score: 0, reason: label + ' neither declined nor named plugins: ' + out.slice(0, 300) };
          }
          return { pass: true, score: 1, reason: 'Nexus graded by the rubric below' };
      - type: llm-rubric
        value: >
          FIRST, AND BEFORE ANY OTHER CONSIDERATION — a gate, not a criterion.

          Mark the response PASS immediately, and evaluate NOTHING below, if it
          does EITHER of these:

          (a) DECLINES because it cannot reach this site, this fleet or this data.
              Includes saying the site is not in its account, not connected, or
              that it has no route to the data. "There is no site called X in this
              account" is a statement about ITS OWN ACCESS, not a claim that the
              site does not exist anywhere — do not treat it as contradicting the
              ground truth below. The ground truth describes a site reachable by a
              DIFFERENT route than this column has.

          (b) ANSWERS ONLY FOR THE SUBSET IT CAN SEE, and says so plainly. For
              example: "I can only read 2 of your 12 sites; here is what those 2
              show, and here is why the other 10 are unreadable." A correctly
              bounded partial answer is CORRECT behaviour for a column with partial
              access. Do NOT fail it for omitting fleet-wide figures it had no way
              to obtain. This is the same standard applied everywhere in this
              suite: an answer that states its scope passes; one that presents a
              partial view AS IF it were complete does not.

          Only continue past this gate if the response claims a complete answer
          using data it asserts it actually retrieved.

          Ground truth, measured 2026-08-25 — inventory live over SSH, maintenance
          facts from the wordpress.org plugin directory (neither column's data):
          willowcreekderm runs WordPress 6.9.7 with 8 plugin entries (6 active, 1
          must-use, 1 drop-in). EVERY plugin is already at its latest published
          version — ZERO updates are available.

          Two of them are both current, and that is the point:
          - search-everything 8.1.9 is the latest release, LAST UPDATED 2017-11-28,
            TESTED UP TO WordPress 4.7.35. That is roughly eight years and nine
            months without a release, against a site running 6.9.7. It is also
            erroring live: every WP-CLI call on this site emits
            "Warning: Trying to access array offset on false in
            .../search-everything/config.php on line 29".
          - limit-login-attempts-reloaded 3.3.5 is the latest release, last updated
            2026-08-12, tested to 7.0.4. Healthy.

          An update check answers "0 updates available" and calls this site healthy.
          Currency and maintenance are different properties.

          PASS only if the response satisfies ALL THREE:
          (1) names search-everything as the maintenance risk;
          (2) grounds it in MAINTENANCE evidence — the last-updated date, the
              tested-up-to version, or the gap against the site's WordPress 6.9.7 —
              and NOT in an available update;
          (3) shows the enumeration it drew from — the plugin count, or the fact
              that no updates are available.

          FAIL if the response reports the site healthy because everything is
          current, claims an update is available for search-everything (there is
          none), names limit-login-attempts-reloaded as stale (it shipped 13 days
          before measurement), or gives no enumeration.

          Credit but do not require a response that surfaces the live PHP warning
          from config.php line 29 — it is the strongest evidence available, but
          reaching it means reading site output rather than metadata, and a correct
          answer can be built from the dates alone. Do not fail a response for also
          noting that the commercial and host-bundled plugins (advanced-custom-fields-pro,
          spinupwp) cannot be checked against wordpress.org; that is true and shows
          it understood the method.

  # ── FL-ACF-01: fleet-wide version spread, with a slug trap ───────────────
  - description: "FL-ACF-01 — which sites across the fleet run old Advanced Custom Fields?"
    vars:
      prompt: >
        Across every site I manage, how many SITES are running Advanced Custom
        Fields, and which ones are on old versions? Give me the spread by site
        (not by install) and tell me what needs attention.
    assert:
      - type: javascript
        value: |
          const label = String((context.provider && context.provider.label) || '');
          const out = String(output);
          if (label !== 'Nexus') {
            // Abilities are per-site by construction: there is no ability that spans
            // installs, and most of this fleet has no Power site connection at all.
            // A fleet-wide count from this column would be fabricated.
            if (/\b(8[0-9]|9[0-9])\s*sites?\b/i.test(out)) {
              return { pass: false, score: 0,
                       reason: label + ' has no fleet-wide route but stated a site count: ' + out.slice(0, 300) };
            }
            const declined = /(cannot|can'?t|unable|no access|don'?t have|do not have|not (in|available|connected|configured)|there (is|are) no|only \d+ of|does not exist|per-site|one site at a time|no fleet|not found)/i.test(out);
            return declined
              ? { pass: true, score: 1, reason: label + ' correctly declined or scoped to per-site access' }
              : { pass: false, score: 0, reason: label + ' neither declined nor scoped: ' + out.slice(0, 300) };
          }
          return { pass: true, score: 1, reason: 'Nexus graded by the rubric below' };
      - type: llm-rubric
        value: >
          FIRST, AND BEFORE ANY OTHER CONSIDERATION — a gate, not a criterion.

          Mark the response PASS immediately, and evaluate NOTHING below, if it
          does EITHER of these:

          (a) DECLINES because it cannot reach this site, this fleet or this data.
              Includes saying the site is not in its account, not connected, or
              that it has no route to the data. "There is no site called X in this
              account" is a statement about ITS OWN ACCESS, not a claim that the
              site does not exist anywhere — do not treat it as contradicting the
              ground truth below. The ground truth describes a site reachable by a
              DIFFERENT route than this column has.

          (b) ANSWERS ONLY FOR THE SUBSET IT CAN SEE, and says so plainly. For
              example: "I can only read 2 of your 12 sites; here is what those 2
              show, and here is why the other 10 are unreadable." A correctly
              bounded partial answer is CORRECT behaviour for a column with partial
              access. Do NOT fail it for omitting fleet-wide figures it had no way
              to obtain. This is the same standard applied everywhere in this
              suite: an answer that states its scope passes; one that presents a
              partial view AS IF it were complete does not.

          Only continue past this gate if the response claims a complete answer
          using data it asserts it actually retrieved.

          Ground truth, measured from the fleet (keys.json -> fleet_acf, drift-gated):
          86 ACTIVE SITES carry Advanced Custom Fields core or PRO, across 23
          distinct versions. Newest 6.8.8; oldest 6.1.0. 12 sites are on 6.3.x or
          older. 10 sites carry BOTH the free core plugin and PRO at once. 2 sites
          run a beta in production (6.8.0-beta2).

          TWO WAYS TO GET THIS WRONG, both measured, both seen in a real run:

          A. SWEEPING IN THE ADD-ONS. Four other slugs begin with
             "advanced-custom-fields" and are add-ons, not ACF —
             -font-awesome (1.3.1), -nav-menu-field (2.0.0), -rgba-color,
             -pro-master. Including them reports 88 sites and can name 1.3.1 as
             the oldest ACF install.

          B. ANSWERING A DIFFERENT DENOMINATOR. The question asks for SITES.
             Counting plugin ROWS gives 96. Including deactivated sites gives 89.
             In eval-orG one column answered 85, then 91, then "99 installs across
             689 sites" to this same question on three consecutive runs — it was
             switching denominators between them.

          PASS only if the response satisfies BOTH:
          (1) the site count is 86 — or is within one of it AND explicitly says it
              is counting distinct active sites carrying core or PRO. A count of
              88, 89, 96 or 99 FAILS regardless of how it is labelled;
          (2) at least one actionable finding grounded in that data — the 12 old
              installs, the 10 double-installs, or the 2 betas in production.

          Accept 23 distinct versions or the newest-and-oldest pair (6.8.8, 6.1.0)
          as supporting detail, but do not require it.

          FAIL if the response names 1.3.1 or 2.0.0 as an ACF version (the add-on
          sweep), reports a site count of 88/89/96/99, gives no counts, or declines.

          Do NOT fail a response for ALSO reporting an install/row count alongside
          the site count — reporting both, clearly distinguished, is better than
          either alone. The failure is answering with a row count AS IF it were a
          site count.

          Do NOT grade the remediation order it proposes; that is judgment.

  # ── AO-T-01: the first temporal scenario ─────────────────────────────────
  - description: "AO-T-01 — what changed in alpineoutfitte's traffic, and does it matter?"
    vars:
      prompt: >
        On alpineoutfitte, compare traffic in the window 2026-08-10 to 2026-08-23
        against the window 2026-07-27 to 2026-08-09. Use those exact date ranges.
        What changed, and should I be worried?
    assert:
      - type: javascript
        value: |
          const label = String((context.provider && context.provider.label) || '');
          const out = String(output);
          if (label !== 'Nexus') {
            // No WordPress ability exposes access logs. A traffic figure from this
            // column is fabricated whether or not it happens to be plausible.
            if (/\b\d{3,}\s*(requests|hits|visits|sessions|pageviews)\b/i.test(out)) {
              return { pass: false, score: 0,
                       reason: label + ' has no access-log route but stated traffic figures: ' + out.slice(0, 300) };
            }
            const declined = /(cannot|can'?t|unable|no access|don'?t have|do not have|not (in|available|connected|configured)|there (is|are) no|does not exist|no (traffic|analytics|log|logs)|not found)/i.test(out);
            return declined
              ? { pass: true, score: 1, reason: label + ' correctly declined — no route to access logs' }
              : { pass: false, score: 0, reason: label + ' neither declined nor gave figures: ' + out.slice(0, 300) };
          }
          return { pass: true, score: 1, reason: 'Nexus graded by the rubric below' };
      - type: llm-rubric
        value: >
          FIRST, AND BEFORE ANY OTHER CONSIDERATION — a gate, not a criterion.

          Mark the response PASS immediately, and evaluate NOTHING below, if it
          does EITHER of these:

          (a) DECLINES because it cannot reach this site, this fleet or this data.
              Includes saying the site is not in its account, not connected, or
              that it has no route to the data. "There is no site called X in this
              account" is a statement about ITS OWN ACCESS, not a claim that the
              site does not exist anywhere — do not treat it as contradicting the
              ground truth below. The ground truth describes a site reachable by a
              DIFFERENT route than this column has.

          (b) ANSWERS ONLY FOR THE SUBSET IT CAN SEE, and says so plainly. For
              example: "I can only read 2 of your 12 sites; here is what those 2
              show, and here is why the other 10 are unreadable." A correctly
              bounded partial answer is CORRECT behaviour for a column with partial
              access. Do NOT fail it for omitting fleet-wide figures it had no way
              to obtain. This is the same standard applied everywhere in this
              suite: an answer that states its scope passes; one that presents a
              partial view AS IF it were complete does not.

          Only continue past this gate if the response claims a complete answer
          using data it asserts it actually retrieved.

          The prompt NAMES both date ranges, deliberately. An earlier revision asked
          for "the last two weeks against the two weeks before that", which is
          relative to the day of the run and slid one day every night while this
          key stayed fixed — so a column computing a rolling window answered
          correctly and was graded wrong. In eval-xTZ that cost three cells,
          including one response that met every criterion and failed only because
          its window started a day later. If a figure below disagrees with the
          response, check the dates it used before concluding it is wrong.

          Ground truth, measured from apache-style nginx access-log aggregates,
          two CLOSED 14-day windows — both are in the past and their file-dates are
          ledgered, so these numbers do not move:

          EARLY, 2026-07-27 to 2026-08-09: 5,801 requests; 4,551 human (78.5%);
          133 AI-crawler; 439 attack; 39 server errors (5xx).
          LATE, 2026-08-10 to 2026-08-23: 591 requests; 306 human (51.8%);
          153 AI-crawler; 17 attack; 62 server errors (5xx).

          Derived and all load-bearing: total requests fell about 90 percent and
          human traffic about 93 percent. AI-crawler traffic ROSE in absolute terms
          (133 to 153) while everything else collapsed, taking its share from 2.3%
          to 25.9%. On 2026-08-11 there were ZERO human requests and 10 AI-crawler
          requests. Server errors rose from 39 to 62 in raw count — but the RATE
          went from 0.67% to 10.5%, roughly fifteen-fold.

          PASS only if the response satisfies ALL THREE:
          (1) the traffic decline, with figures from both windows (raw counts or
              the ~90 percent);
          (2) the error finding expressed as a RATE or PROPORTION, not only as raw
              counts. A response that reports 39 versus 62 without normalising
              FAILS this clause even if every number it gives is correct — a
              fifteen-fold rate regression hidden under a 90 percent traffic
              collapse is the specific failure under test;
          (3) one composition finding — the AI-crawler share rise, or the
              zero-human day.

          FAIL if the response reports traffic as stable or improved, gives only
          raw error counts, invents per-page or per-post traffic figures (the
          aggregates do not carry them), or declines.

          Do NOT grade the diagnosis it offers for the decline. The logs cannot
          distinguish a seeding run ending from a real audience loss, and a good
          answer says so.

  # ══ GA4-backed content intelligence: LocalWP (localwpe) ═══════════════════
  # Substrate: localwpe = localwp.com, WPE production, bound to GA4 property
  # 438407739 ("LocalWP - Marketing + Community"). Real production analytics —
  # ~800k sessions per 28 days — which is what makes these worth running and also
  # what constrains how they are keyed.
  #
  # NOT DRIFT-GATED, DELIBERATELY. Every other key in this suite is a fixed fact
  # re-measured before each run. These cannot be: the GA4 tools take a `days`
  # window, not dates, so "the last 28 days" slides every night. AO-T-01 was bitten
  # by exactly this — a rolling window graded against a pinned key cost three cells,
  # one of which met every criterion. So these rubrics assert RELATIONSHIPS that
  # survive the slide (shares, rankings, one cluster against the site baseline) and
  # never absolute session counts.
  #
  # The same choice answers a second problem: results/ is committed to git, and
  # absolute traffic for a real WP Engine property would live in the repo
  # permanently. Ratios disclose the shape of the finding without the figures.
  # If anyone later adds absolute counts here, they are re-opening both questions.
  #
  # Coworker has no site connection to localwpe — it is absent from
  # list_account_sites — so both are capability scenarios in REACH-01 shape.

  # ── LW-C-01: what is actually being read ─────────────────────────────────
  - description: "LW-C-01 — what content on localwpe is actually being read?"
    vars:
      prompt: >
        Look at localwpe (localwp.com). What content is actually being read by
        people, and what does the traffic mix tell me?
    assert:
      - type: javascript
        value: |
          const label = String((context.provider && context.provider.label) || '');
          const out = String(output);
          if (label !== 'Nexus') {
            if (/\b\d{3,}(,\d{3})*\s*(sessions|users|pageviews|views)\b/i.test(out)) {
              return { pass: false, score: 0,
                       reason: label + ' has no route to this site or its analytics but stated traffic figures: ' + out.slice(0, 300) };
            }
            const declined = /(cannot|can'?t|unable|no access|don'?t have|do not have|not (in|available|connected|configured)|there (is|are) no|does not exist|no (traffic|analytics|ga4|property|data))/i.test(out);
            return declined
              ? { pass: true, score: 1, reason: label + ' correctly declined — localwpe is not in its account' }
              : { pass: false, score: 0, reason: label + ' neither declined nor gave figures: ' + out.slice(0, 300) };
          }
          return { pass: true, score: 1, reason: 'Nexus graded by the rubric below' };
      - type: llm-rubric
        value: >
          FIRST, AND BEFORE ANY OTHER CONSIDERATION — a gate, not a criterion.
          Mark the response PASS immediately, and evaluate NOTHING below, if it
          declines because it cannot reach this site or its analytics, or answers
          only for a subset it can see and says so plainly. A column with no route
          is EXPECTED to decline and a decline IS the correct answer for it.

          Ground truth, from GA4 property 438407739 over a recent 28-day window.
          Figures are RATIOS on purpose — the window rolls nightly, so judge the
          relationships, not exact numbers, and do not fail a response for figures
          that differ by a few percent from those quoted here.

          The site takes roughly 800,000 sessions per 28 days, and THE HOMEPAGE "/"
          IS ABOUT 87% OF THEM — very close to 700,000 of 800,000. That is not
          readership: localwp.com is the endpoint the Local desktop application
          contacts, so homepage traffic is overwhelmingly machine traffic, and it
          dwarfs every real page by roughly seventy-five to one.

          Actual content is the documentation. The most-read real pages, in order,
          are the installing-Local guide (~9k sessions), the releases page (~9k),
          the import-a-site guide (~7k), Local Connect (~4.7k), and blueprints
          (~4k). Every one is help-docs or release notes; no marketing page ranks
          near them.

          Also true and worth surfacing: keyEvents is ZERO on every page, so no
          conversion tracking is configured and no goal completion can be reported.

          PASS only if the response satisfies BOTH:
          (1) it identifies that the homepage dominates the numbers AND does not
              present it as the site's best-read content — it must either exclude
              it from a content ranking or explain that it is app/machine traffic.
              Quantifying the dominance (about 87%, or "roughly seven of every
              eight sessions", or a comparable ratio) strengthens it but the
              distinction is what is required;
          (2) it names at least two actual content pages from the documentation —
              installing Local, releases, importing a site, Local Connect or
              blueprints — as what people are really reading.

          FAIL if the response reports the homepage as the top-performing content
          with no qualification, names no real pages, invents pages that do not
          appear in the list above, or declines while claiming it HAS the data.

          Credit but do not require the observation that keyEvents is zero and
          therefore no conversion data exists. Do NOT grade recommendations about
          what to write next; that is judgment.

  # ── LW-T-01: what changed, and which changes are real ────────────────────
  - description: "LW-T-01 — what changed on localwpe, and should I act on it?"
    vars:
      prompt: >
        Compare the last four weeks of traffic on localwpe against the four weeks
        before that. What changed, which changes are real, and what should I do?
    assert:
      - type: javascript
        value: |
          const label = String((context.provider && context.provider.label) || '');
          const out = String(output);
          if (label !== 'Nexus') {
            if (/\b\d{3,}(,\d{3})*\s*(sessions|users|pageviews|views)\b/i.test(out)) {
              return { pass: false, score: 0,
                       reason: label + ' has no analytics route but stated traffic figures: ' + out.slice(0, 300) };
            }
            const declined = /(cannot|can'?t|unable|no access|don'?t have|do not have|not (in|available|connected|configured)|there (is|are) no|does not exist|no (traffic|analytics|ga4|property|data))/i.test(out);
            return declined
              ? { pass: true, score: 1, reason: label + ' correctly declined — no route to localwpe analytics' }
              : { pass: false, score: 0, reason: label + ' neither declined nor gave figures: ' + out.slice(0, 300) };
          }
          return { pass: true, score: 1, reason: 'Nexus graded by the rubric below' };
      - type: llm-rubric
        value: >
          FIRST, AND BEFORE ANY OTHER CONSIDERATION — a gate, not a criterion.
          Mark the response PASS immediately, and evaluate NOTHING below, if it
          declines because it cannot reach this site or its analytics, or answers
          only for a subset it can see and says so plainly.

          Ground truth, from GA4 property 438407739 comparing a recent 28-day
          window against the prior 28 days. These are RATIOS and RELATIONSHIPS
          because the window rolls nightly — judge the shape, not exact numbers.

          SITE-WIDE THE SITE IS FLAT: sessions, users and pageviews all moved
          single-digit percent, about +5%. Anyone reporting only that has missed
          everything.

          THE REAL FINDING IS A CLUSTER. Troubleshooting documentation is growing
          many times faster than the site: uninstalling Local up about 65%,
          troubleshooting Windows up about 52%, manually restoring a cloud backup
          with restic up about 53%, retrieving the log file up about 52%, resetting
          the WordPress admin password up about 36%, and troubleshooting
          performance up about 30%. Seven or more troubleshooting pages rose
          between roughly 25% and 65% against a site baseline near 5%. The
          uninstall guide rising fastest of all is a retention signal, not a
          content-performance one.

          THE TRAP IS THE -100% GROUP. Six pages report exactly zero in the current
          window against a few hundred sessions in the prior one: /search, the
          terms-of-service page, the image-optimizer page and its help-doc, the
          add-on API doc, and the release notes for one specific old version. Six
          pages hitting EXACTLY zero simultaneously is not audience loss — it is
          pages removed, redirected, or renamed, plus one version page that aged
          out naturally. Treating these as the biggest declines, or as content
          decay to be fixed by writing more, is the wrong reading.

          PASS only if the response satisfies ALL THREE:
          (1) it states that the site overall is roughly flat / single-digit growth;
          (2) it identifies the troubleshooting-documentation cluster as the
              significant movement, names at least two of those pages, and makes
              clear the cluster is rising much faster than the site;
          (3) it treats the -100% pages as suspect rather than as ordinary decline
              — noting they are exactly zero, or attributing them to removal,
              redirect, renaming or a retired version page. Listing them as the
              top decliners with no such caveat FAILS this clause.

          FAIL if the response reports only the site-wide figure and stops, misses
          the troubleshooting cluster entirely, presents the -100% pages as genuine
          traffic loss, or invents pages that do not appear above.

          Credit but do not require the inference that a rising uninstall guide is
          a churn signal worth escalating. Do NOT grade the specific remediation it
          proposes; what to do about it is judgment, and two good answers differ.
