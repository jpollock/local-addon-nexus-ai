# Platform Benchmark — Nexus vs Coworker vs WordPress
# Spec: docs/planning/2026-08-21-platform-benchmark-design.md
#
# Two MCP surfaces, one model, identical prompts.
# WordPress column deferred — core abilities (site-info, user-info, env-info)
# do not reach content. Will revisit with custom ability implementation.
# Repeat: 3 (raise to 5 before publishing any numbers).
#
# Run via ./run.sh, NOT promptfoo directly — run.sh clears the per-cwd Claude
# memory each column would otherwise carry between runs. See providers/isolation.js
# for both isolation leaks found in eval-t7J-2026-08-24T22:22:15 and how they close.
#
# Every answer key below is verified against the sites themselves (wp eval over
# SSH, 2026-08-24), never against a column's own answer. A key copied from the
# output you are grading is not a key.
#
# Run:
#   ./run.sh
#   npx promptfoo view

description: "Platform benchmark — Nexus vs Coworker (Cedar & Vale substrate)"

evaluateOptions:
  maxConcurrency: 1   # providers call external services; sequential avoids rate limits
  repeat: 3           # 3 per cell; raise to 5 before publishing

providers:
  - id: file:///Users/jeremy.pollock/development/wpengine/local-addon-nexus-ai/tests/platform-bench/providers/nexus.js
    label: Nexus

  - id: file:///Users/jeremy.pollock/development/wpengine/local-addon-nexus-ai/tests/platform-bench/providers/coworker.js
    label: Coworker

# ── Substrate constants ────────────────────────────────────────────────────────
# Sites in scope. Update if the fleet changes.
# Coworker collection IDs are stable per-site and hard-coded in coworker.js.
#
#   Flagship  cedarvalehealt.wpenginepowered.com    col_elNAyZoSKGhJoFCFqHSK12
#   Site A    summitdermatol.wpenginepowered.com    col_KO2gvD3Tbw5Rvuv0msq4dQ
#   Site B    palegreen-capybara-114180.hostingersite.com  col_tErE8KxfsfxWrtd1HscbCe

defaultTest:
  assert:
    - type: latency
      threshold: 600000   # 10 min max per cell
  # cost assertions are omitted globally — claude CLI does not return cost metadata.
  # Track spend via Anthropic Console dashboard instead.

# ── Test cases ────────────────────────────────────────────────────────────────
tests:
  # ── CV-A-01: missing openingHoursSpecification ────────────────────────────
  - description: "CV-A-01 — which clinic sites are missing opening hours?"
    vars:
      prompt: >
        Look at the clinic locations across cedarvalehealt and summitdermatol.
        Which site's locations are missing opening hours data, and which has it?
        Be specific about which site has the gap.
    assert:
      # Answer key: summitdermatol locations have acf_hours="" (empty).
      # cedarvalehealt locations have hours on all 25 locations.
      #
      # Correct answer: summitdermatol is missing hours; cedarvalehealt has them.
      # Wrong answers that must fail:
      #   "neither has hours"    — Coworker said this (vacuously passed before)
      #   "cedarvalehealt is missing" — hallucination
      - type: icontains
        value: "summitdermatol"
      # A gap must be identified somewhere in the answer. This was
      # icontains-any ["missing","no hours","without hours","empty","absent","lacks"]
      # and produced a third false negative in eval-NHz-2026-08-25T12:47:28: Nexus
      # wrote "**`summitdermatol` — no opening hours at all**", which is correct and
      # which "no hours" does not match — one word of natural phrasing between "no"
      # and "hours" defeats the literal. Same defect class as the clause below, in
      # the clause next door.
      #
      # Deliberately NOT scoped to a summitdermatol clause: real answers use a
      # heading-then-body shape ("### summitdermatol" / "No hours fields at all"),
      # which puts the site name and the gap phrase in different clauses. The
      # discrimination lives in the cedarvalehealt clause and the must-not list;
      # this one only has to see that a gap was named at all.
      - type: javascript
        value: |
          const GAP = /(missing|lacks?\b|lacking|absent|\bempty\b|\bnone\b|zero hours|without[^.;\n]{0,24}\bhours\b|\bno\b[^.;\n]{0,24}\bhours\b|does ?n[o']?t (have|exist|appear)|not (populated|present|registered|indexed|exist))/i;
          const m = GAP.exec(String(output));
          return m
            ? { pass: true, score: 1, reason: 'gap identified: "' + m[0] + '"' }
            : { pass: false, score: 0, reason: 'no clause identifies a missing-hours gap on either site' };
      # cedarvalehealt must be stated as HAVING hours — this is what separates the
      # correct answer from "neither site has hours", which is what Coworker says.
      #
      # This was `icontains-any: ["cedarvalehealt has", ...]` and produced two false
      # negatives in eval-VWU-2026-08-25T02:50:14: Nexus answered
      #   "**summitdermatol** has the gap. **cedarvalehealt** has the data."
      # which is correct, and which no literal "cedarvalehealt has" can match — the
      # markdown bold sits between the name and the verb. The one run that passed
      # passed by accident of phrasing. A substring list cannot express "the site is
      # said to have hours" over prose a model is free to format.
      #
      # So: split into clauses, find the ones naming cedarvalehealt, and read what is
      # claimed about it. A clause that negates (missing/lacks/absent) does not count
      # as having, so the inverted answer still fails here and not only on the
      # must-not clause below. The domain suffix is stripped first because splitting
      # on "." would otherwise cut "cedarvalehealt.wpenginepowered.com has hours"
      # into a fragment holding the name and a fragment holding the verb.
      - type: javascript
        value: |
          const out = String(output).replace(/\.wpenginepowered\.com/gi, '');
          const NEG = /\b(missing|lacks?|lacking|empty|absent|no hours|does not|doesn'?t|without|none|zero|not (have|present|populated))\b/i;
          const POS = /\b(has|have|carries|carry|contains|populated|present|complete|covered)\b/i;
          let ok = false, negated = false;
          const clauses = out.split(/[.;\n]+/);
          for (let c = 0; c < clauses.length; c++) {
            const clause = clauses[c];
            const i = clause.toLowerCase().indexOf('cedarvalehealt');
            if (i === -1) continue;
            let after = clause.slice(i + 'cedarvalehealt'.length);
            // A clause that is a bare heading ("### cedarvalehealt", "**cedarvale-
            // healt**") names the subject and defers the claim to the body that
            // follows. Read the next clause in that case — but only then, and only
            // if it does not name the other site, so a clause carrying its own
            // content is never allowed to borrow a verdict from its neighbour.
            const residue = (clause.slice(0, i) + after)
              .replace(/[^a-z0-9\s]/gi, ' ').trim().split(/\s+/).filter(Boolean);
            if (residue.length <= 3 && !/\b(has|have|missing|lacks?|absent|carries|carry)\b/i.test(after)) {
              const next = clauses[c + 1] || '';
              if (!/summitdermatol/i.test(next)) after = after + ' ' + next;
            }
            // Whichever verb sits NEARER the site name is the one making a claim
            // about it. A clause can hold both — "cedarvalehealt has hours,
            // summitdermatol is missing them" — and testing NEG first would read
            // the other site's verb as this site's.
            const p = POS.exec(after), n = NEG.exec(after);
            if (p && (!n || p.index < n.index)) ok = true;
            else if (n) negated = true;
          }
          if (ok) return { pass: true, score: 1, reason: 'cedarvalehealt stated as having hours' };
          return { pass: false, score: 0, reason: negated
            ? 'cedarvalehealt stated as MISSING hours — the gap is summitdermatol'
            : 'no clause states cedarvalehealt has hours (the "neither site has hours" answer)' };
      # must_not: a provider that says neither or both are missing is wrong
      - type: not-icontains-any
        value: ["neither site has", "neither has hours", "both sites are missing",
                "both lack", "cedarvalehealt is missing", "cedarvalehealt lacks"]
  # ── CV-B-01: cross-site provider contradiction ────────────────────────────
  - description: "CV-B-01 — which providers accept new patients at two different practices?"
    vars:
      prompt: >
        Check the providers on cedarvalehealt and palegreen-capybara-114180.hostingersite.com.
        Are any providers listed as accepting new patients at both sites simultaneously?
        How many, and name them.
    assert:
      # Answer key, verified by wp eval on both sites 2026-08-24:
      #   cedarvalehealt  60 providers, 45 accepting
      #   palegreen       27 providers, 23 accepting
      #   overlap on NPI  23 — every accepting Ridgeline provider is also
      #                   accepting at Cedar & Vale; ZERO are Ridgeline-only.
      # The old key named Elian Mills / NPI 1274960149 as *the* contradiction.
      # Elian Mills is real and is in the overlap, but the substrate holds 23 such
      # providers, not one — so no correct answer could satisfy a single-NPI key,
      # and the answer it did reward (exactly one) is wrong.
      #
      # The count is the discriminator. An answer naming one provider cannot
      # contain a standalone 23, so this also excludes the old key's answer.
      - type: regex
        value: '\b23\b'
      # Any correct answer enumerates or samples the overlap. These six are all
      # confirmed members, spread across both sites' natural result order, so a
      # partial list still hits one; a fabricated name hits none.
      - type: icontains-any
        value: ["elian mills", "elias lowe", "cielo wehner", "susan hand",
                "clementine lang", "emilie gutkowski"]
      - type: icontains-any
        value: ["both", "two", "simultaneously", "overlap"]
      # must_not: deny an overlap that exists 23 times over
      - type: not-icontains-any
        value: ["no provider is listed as accepting", "no providers are accepting at both",
                "there is no overlap", "none of the providers", "no provider appears on both"]
      # must_not: hallucinate a site it cannot see
      - type: not-icontains
        value: "willowcreekderm"
  # ── CV-G-01: stale medical reviews ───────────────────────────────────────
  - description: "CV-G-01 — how many treatments on cedarvalehealt have not been reviewed in 3+ years?"
    vars:
      prompt: >
        On cedarvalehealt, how many treatment pages have not been clinically reviewed
        in the past three years? What is the count, and what is the review status?
    assert:
      # Answer key, verified by wp eval on cedarvalehealt 2026-08-24 over the
      # `treatment` post type (meta keys `review_status` and `review_date`):
      #   45 treatments total
      #    8 review_status=overdue, review_date 2021-10-18 … 2023-05-12 (all >3y)
      #    2 review_status=unreviewed, review_date empty
      #   35 reviewed within the window
      #   → 10 of 45 have not been reviewed in three years.
      # The old key said 8, which drops the 2 unreviewed pages — and asserted it
      # as icontains-any ["8","eight"], which any output containing a date passes
      # ("2026-08-24"). Both columns already answer 10 of 45 correctly; the
      # assertion was measuring nothing either way.
      - type: icontains-any
        value: ["10 of 45", "10 of the 45", "10 treatment", "10 pages", "10 out of 45"]
      # The split is what separates a real count from a lucky total.
      - type: regex
        value: '\b8\b'
      - type: icontains
        value: "overdue"
      - type: icontains-any
        value: ["unreviewed", "never been reviewed", "no review date", "never reviewed"]
      # must_not: the stale key's answer — 8 alone, missing the 2 unreviewed
      - type: not-icontains-any
        value: ["8 of 45", "8 of the 45", "8 treatment pages have not"]
  # ── Reach test: ask about a site only Nexus can see ──────────────────────
  # Ground truth verified 2026-08-24:
  #   `nexus wp core version ssh:willowcreekderm/willowcreekderm@production` → 6.9.7
  #   willowcreekderm is a registered external SSH host in Nexus; it has no
  #   Coworker KB collection and no WordPress MCP connection.
  #
  # The two columns are graded on OPPOSITE expectations, so one assertion cannot
  # express both. The old single `icontains-any` accepted the union of every
  # outcome — "6.9.7", a bare "6.9", *or* any refusal — which every column passes
  # no matter what it does. It measured nothing.
  #
  # Per-provider via context.provider.label (verified available in this promptfoo
  # version). Nexus must return the live version. Every other column must decline,
  # and must NOT state a version — with `--tools ""` it has no route to this site,
  # so a version is fabricated whether or not it happens to be right.
  - description: "Reach — willowcreekderm (external SSH only; Nexus must answer, others must decline)"
    vars:
      prompt: >
        What WordPress version is willowcreekderm.com running?
    assert:
      - type: javascript
        value: |
          const label = String((context.provider && context.provider.label) || '');
          const out = String(output);
          if (label === 'Nexus') {
            return out.includes('6.9.7')
              ? { pass: true, score: 1, reason: 'Nexus reported the live version 6.9.7' }
              : { pass: false, score: 0,
                  reason: 'willowcreekderm is a registered external SSH host in Nexus; expected 6.9.7. Got: '
                          + out.slice(0, 300) };
          }
          // No route to this site: any version number is fabricated.
          const versionClaim = /\b\d+\.\d+(\.\d+)?\b/.test(out);
          if (versionClaim) {
            return { pass: false, score: 0,
                     reason: label + ' has no route to willowcreekderm but stated a version: '
                             + (out.match(/\b\d+\.\d+(\.\d+)?\b/) || [''])[0] };
          }
          const declined = /(cannot|can'?t|unable|no access|don'?t have|do not have|not (in|available|connected|configured|part of|one of)|isn'?t (in|available)|no (knowledge|collection|data|record|kb)|not found)/i.test(out);
          return declined
            ? { pass: true, score: 1, reason: label + ' correctly declined — no route to this site' }
            : { pass: false, score: 0,
                reason: label + ' neither declined nor gave a version: ' + out.slice(0, 300) };
