name: Package Addon

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # Quality gate (P1-1): a tag must pass lint + typecheck + tests + secret scan before anything
  # is built, signed, or published. Before this, a tag shipped untested.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (T-CI-HERMETIC: pinned to SHA)
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (T-CI-HERMETIC: pinned to SHA)
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: node scripts/scan-secrets.js

  package:
    needs: verify
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: macos-14
            platform: darwin
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-2022
            platform: win32
            arch: x64

    runs-on: ${{ matrix.os }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (T-CI-HERMETIC: pinned to SHA)

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (T-CI-HERMETIC: pinned to SHA)
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Fetch model from R2 cache (or download from Hugging Face)
        shell: bash
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          MODEL_KEY="model-cache/all-MiniLM-L6-v2-quantized.tar.gz"
          mkdir -p models
          if aws s3 cp "s3://nexus-ai-releases/${MODEL_KEY}" /tmp/model-cache.tar.gz \
              --endpoint-url "$ENDPOINT" --region auto --quiet 2>/dev/null; then
            tar -xzf /tmp/model-cache.tar.gz -C models
            echo "✅ Model restored from R2 cache"
          else
            echo "⬇️ R2 cache miss — downloading from Hugging Face"
            npm run download-model
            tar -czf /tmp/model-cache.tar.gz -C models .
            aws s3 cp /tmp/model-cache.tar.gz \
              "s3://nexus-ai-releases/${MODEL_KEY}" \
              --endpoint-url "$ENDPOINT" --region auto --quiet || true
            echo "✅ Model downloaded and saved to R2 cache"
          fi

      - name: Setup MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1 (T-CI-HERMETIC: pinned third-party action to SHA)

      - name: Build
        run: npm run build

      - name: Package for ${{ matrix.platform }}-${{ matrix.arch }}
        env:
          GYP_MSVS_VERSION: '2022'
          npm_config_msvs_version: '2022'
        run: node scripts/package-addon.js --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      # P0-3: sign every release tarball with the Ed25519 release key. The CLI verifies this
      # signature before extracting the addon; a missing/invalid .sig is a hard refusal. Fails
      # the release if the signing key is absent — an unsigned release must never ship.
      - name: Sign tarballs
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          NEXUS_SIGNING_KEY: ${{ secrets.NEXUS_SIGNING_KEY }}
        run: |
          if [ -z "$NEXUS_SIGNING_KEY" ]; then
            echo "::error::NEXUS_SIGNING_KEY secret is not set — releases must be signed (P0-3)."
            exit 1
          fi
          for tarball in dist/*.tgz; do
            [ -f "$tarball" ] || continue
            node scripts/sign-release.js "$tarball"
          done
          echo "✅ Tarballs signed"

      - name: Upload tarball to R2
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          for tarball in dist/*.tgz; do
            [ -f "$tarball" ] || continue
            FILENAME=$(basename "$tarball")
            echo "Uploading $FILENAME to R2..."
            aws s3 cp "$tarball" \
              "s3://nexus-ai-releases/nexus-ai/v${VERSION}/${FILENAME}" \
              --endpoint-url "$ENDPOINT" \
              --region auto
            # Upload the detached signature alongside it. Required — the CLI refuses an
            # unsigned release, so a missing .sig here would break auto-update.
            if [ ! -f "${tarball}.sig" ]; then
              echo "::error::Missing signature ${FILENAME}.sig — refusing to publish an unsigned release."
              exit 1
            fi
            aws s3 cp "${tarball}.sig" \
              "s3://nexus-ai-releases/nexus-ai/v${VERSION}/${FILENAME}.sig" \
              --endpoint-url "$ENDPOINT" \
              --region auto
          done
          echo "✅ Tarballs + signatures uploaded to R2"

  release:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

    steps:
      - name: Download tarballs from R2 and create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # Download all tarballs for this version from R2
          mkdir -p dist
          aws s3 sync \
            "s3://nexus-ai-releases/nexus-ai/v${VERSION}/" \
            dist/ \
            --endpoint-url "$ENDPOINT" \
            --region auto

          echo "Downloaded tarballs:"
          ls -la dist/

          # Create GitHub Release (delete existing draft if any, then create fresh)
          gh release delete $GITHUB_REF_NAME \
            --repo ${{ github.repository }} \
            --yes 2>/dev/null || true

          # Attach the tarballs AND their .sig signatures (the aws s3 sync above pulled both),
          # so manual downloads from the GitHub Release can also be verified (P0-3).
          gh release create $GITHUB_REF_NAME \
            --repo ${{ github.repository }} \
            --title "Nexus AI v${VERSION}" \
            --generate-notes \
            dist/*.tgz dist/*.tgz.sig

          echo "✅ GitHub Release created with all tarballs + signatures"

          # Update latest.json
          echo "{\"version\":\"${VERSION}\"}" > /tmp/latest.json
          aws s3 cp /tmp/latest.json \
            "s3://nexus-ai-releases/nexus-ai/latest.json" \
            --endpoint-url "$ENDPOINT" \
            --region auto \
            --cache-control "no-cache, max-age=0"
          echo "✅ latest.json updated to v${VERSION}"

  publish-npm:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (T-CI-HERMETIC: pinned to SHA)

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (T-CI-HERMETIC: pinned to SHA)
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        # --ignore-scripts skips onnxruntime-node postinstall (GPU binary download)
        # publish-npm only needs TypeScript compilation, not native binaries or ONNX model
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
