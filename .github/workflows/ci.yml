name: CI

# Quality gate (P1-1): lint + typecheck + tests + secret scan on every push and PR. Before this,
# nothing ran the suite in CI and a tag could publish untested.
#
# BOTH long-lived branches are listed, and `develop` is the load-bearing one.
# `develop` is where work lands and `main` only ever receives a release, so a
# main-only trigger would gate the branch that changes least and leave the one
# that changes daily untested. A solo maintainer pushes straight to `develop`
# rather than opening a PR to themselves, so the `pull_request` trigger below
# does not cover it either — that combination is how v0.5.2 came to ship from a
# commit no CI run had ever seen.
on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (T-CI-HERMETIC: pinned to SHA)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (T-CI-HERMETIC: pinned to SHA)
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (T-CI-HERMETIC: pinned to SHA)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (T-CI-HERMETIC: pinned to SHA)
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    # A hung job otherwise burns GitHub's 360-minute default. On 2026-09-12 two
    # shards sat in jest's shutdown for ~2 hours before being cancelled by hand.
    # A shard is ~172 suites and finishes in minutes; 15 turns a hang into a
    # fast, explicit failure instead of a job that merely sits there.
    timeout-minutes: 15
    # SHARDED ACROSS FOUR RUNNERS. A single runner is 4 cores, so jest gets
    # maxWorkers=3 against 698 suites and 1,570 TypeScript files that ts-jest
    # compiles from cold on every run (only node_modules is cached, not jest's
    # transform output). Measured 2026-09-12: serial 105 min (cancelled
    # unfinished), single-runner parallel ~30 min. Four shards run concurrently
    # on their own 4 cores each.
    #
    # Verified before adopting: --shard partitions 698 suites into
    # 175/175/174/174 with zero overlap and no suite dropped.
    #
    # fail-fast: false so one failing shard does not cancel the other three —
    # a partial failure list is how you end up fixing one bug per CI round.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (T-CI-HERMETIC: pinned to SHA)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (T-CI-HERMETIC: pinned to SHA)
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      # Fast, fully-mocked unit + main suites (jest.ci.config.js excludes known-failing suites —
      # see that file and docs/planning/2026-08-12-p1-plan.md). GitHub sets CI=true, which
      # disables outbound telemetry so no test makes a real network call.
      - run: npm run test:ci -- --shard=${{ matrix.shard }}/4

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (T-CI-HERMETIC: pinned to SHA)
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2 (T-CI-HERMETIC: pinned third-party action to SHA)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 (T-CI-HERMETIC: pinned to SHA)
        with:
          node-version-file: .nvmrc
      - name: scan-secrets (repo net)
        run: node scripts/scan-secrets.js
